name: BimaNyaya CI Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Frontend Web App (TanStack Start, React 19, Vite, Vitest)
  # -----------------------------------------------------------
  frontend:
    name: Web Frontend (Vite & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Type Check (TypeScript)
        working-directory: ./apps/web
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Component Tests
        working-directory: ./apps/web
        run: npm run test

      - name: Build Production Client & SSR Bundles
        working-directory: ./apps/web
        run: npm run build

  # -----------------------------------------------------------
  # 2. Go Core API Gateway
  # -----------------------------------------------------------
  backend-go:
    name: Go Core API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum

      - name: Download Go Dependencies
        working-directory: ./apps/api
        run: go mod download

      - name: Run Go Vet
        working-directory: ./apps/api
        run: go vet ./...

      - name: Run Go Unit Tests
        working-directory: ./apps/api
        run: go test -v -race ./...

      - name: Compile Go Binary
        working-directory: ./apps/api
        run: go build -v ./cmd/api

  # -----------------------------------------------------------
  # 3. Python AI-Worker (FastAPI, OCR, RAG Reasoning)
  # -----------------------------------------------------------
  backend-python:
    name: Python AI Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/ai-worker/requirements.txt

      - name: Install Python Dependencies
        working-directory: ./apps/ai-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        working-directory: ./apps/ai-worker
        run: python -m pytest -v

  # -----------------------------------------------------------
  # 4. Convex Backend Validation
  # -----------------------------------------------------------
  convex-check:
    name: Convex Schema & Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm install

      - name: Verify Convex TypeScript Compilation
        run: npx tsc --noEmit
